<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title id="t">One memory or two</title>
  <desc id="d">Left, von Neumann: the CPU talks to one memory holding code and data over one bus, so fetches and data accesses take turns. Right, Harvard: the CPU talks to an instruction memory over one bus and a data memory over another, and code and data live in separate address spaces, so a fetch and a data access can happen together.</desc>
  <rect width="960" height="330" fill="#ffffff"/>

  <g fill="#333" font-weight="bold" font-size="16">
    <text x="20" y="28">Von Neumann</text>
    <text x="500" y="28">Harvard</text>
  </g>
  <text x="170" y="28" font-size="14" font-style="italic" fill="#2a6f97">&#8592; where this core is now</text>

  <g fill="#f6f6f2" stroke="#333" stroke-width="2">
    <rect x="20"  y="130" width="120" height="70" rx="4"/>
    <rect x="260" y="105" width="190" height="120" rx="4"/>
    <rect x="500" y="130" width="120" height="70" rx="4"/>
    <rect x="740" y="60"  width="190" height="90" rx="4"/>
    <rect x="740" y="190" width="190" height="90" rx="4"/>
  </g>
  <rect x="260" y="105" width="190" height="120" rx="4" fill="#e6f0f6" stroke="#2a6f97" stroke-width="2"/>

  <g fill="#333" text-anchor="middle">
    <text x="80" y="170" font-weight="bold">CPU</text>
    <text x="355" y="158" fill="#1d5470" font-weight="bold">One memory</text><text x="355" y="178" font-size="13" fill="#1d5470">code and data</text><text x="355" y="198" font-size="13" fill="#1d5470">one address space</text>
    <text x="560" y="170" font-weight="bold">CPU</text>
    <text x="835" y="98" font-weight="bold">Instruction memory</text><text x="835" y="118" font-size="13">its own addresses</text>
    <text x="835" y="228" font-weight="bold">Data memory</text><text x="835" y="248" font-size="13">its own addresses</text>
  </g>

  <g stroke="#333" stroke-width="2" fill="none">
    <path d="M140 165 H260"/>
    <path d="M620 150 H680 V105 H740"/>
    <path d="M620 180 H680 V235 H740"/>
  </g>
  <g fill="#333">
    <path d="M149 160 L140 165 L149 170 Z"/><path d="M251 160 L260 165 L251 170 Z"/>
    <path d="M731 100 L740 105 L731 110 Z"/>
    <path d="M629 175 L620 180 L629 185 Z"/><path d="M731 230 L740 235 L731 240 Z"/>
  </g>
  <g fill="#333" font-size="13" text-anchor="middle">
    <text x="200" y="154">one bus</text>
    <text x="715" y="92" >fetch</text>
    <text x="700" y="256">load, store</text>
  </g>
  <g fill="#333" font-size="13" text-anchor="middle" font-style="italic">
    <text x="240" y="268">fetch and data take turns</text>
    <text x="720" y="312">fetch and data can happen together</text>
  </g>
</svg>

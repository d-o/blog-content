  <text x="366" y="112" text-anchor="middle" font-size="12" fill="#1d5470">computer samples ce here</text>
  <path d="M366 116 V180" stroke="#2a6f97" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="638" y="112" text-anchor="middle" font-size="12" fill="#1d5470">and here</text>
  <path d="M638 116 V180" stroke="#2a6f97" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="570" y="25" text-anchor="middle" font-size="13" fill="#333">ce changes on the falling edge, steady half a clock either side of the rising edge that samples it</text>
  <text x="570" y="312" text-anchor="middle" font-size="13" fill="#333">the clock and the timer never stop; the CPU only moves when ce is high</text>

  <path d="M230 150 H332 V120 H400 V150 H604 V120 H672 V150 H910 " stroke="#2a6f97" stroke-width="2.5" fill="none"/>
  <rect x="232" y="180" width="132" height="40" rx="4" fill="#f6f6f2" stroke="#333" stroke-width="2"/>
  <text x="298" y="205" text-anchor="middle" fill="#333">FETCH</text>
  <rect x="368" y="180" width="268" height="40" rx="4" fill="#f6f6f2" stroke="#333" stroke-width="2"/>
  <text x="502" y="205" text-anchor="middle" fill="#333">EXECUTE</text>

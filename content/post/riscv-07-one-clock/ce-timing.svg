  <path d="M774 40 V290" stroke="#e1e1da" stroke-width="1"/>
  <path d="M842 40 V290" stroke="#e1e1da" stroke-width="1"/>
  <path d="M910 40 V290" stroke="#e1e1da" stroke-width="1"/>

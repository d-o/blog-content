<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title id="t">One clock and a clock enable</title>
  <desc id="d">A timing diagram. The clock never stops. The clock enable, ce, goes high for one clock at a time, changing on the falling edge of the clock. On the next rising edge, with ce high, the computer takes a step and the CPU state moves on. Between those pulses the CPU holds. The timer tick counter runs on every clock regardless.</desc>
  <rect width="960" height="330" fill="#ffffff"/>
  <text x="212" y="75" text-anchor="end" fill="#333" font-weight="bold">clk</text>
  <text x="212" y="140" text-anchor="end" fill="#333" font-weight="bold">ce</text>
  <text x="212" y="205" text-anchor="end" fill="#333" font-weight="bold">CPU state</text>
  <text x="212" y="270" text-anchor="end" fill="#333" font-weight="bold">timer tick</text>
  <path d="M230 40 V290" stroke="#e1e1da" stroke-width="1"/>
  <path d="M298 40 V290" stroke="#e1e1da" stroke-width="1"/>
  <path d="M366 40 V290" stroke="#e1e1da" stroke-width="1"/>
  <path d="M434 40 V290" stroke="#e1e1da" stroke-width="1"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title id="t">From C source to the core</title>
  <desc id="d">hello.c is compiled by the RISC-V gcc for rv32e and ilp32e. It is linked with a linker script, a start-up file crt0.S and libgcc, which supplies multiply, divide and remainder because the core has no M extension. objcopy makes a binary. A script checks every instruction word against the model's list of legal encodings and writes the image. The image becomes the RAM's initial contents and the core runs it in simulation.</desc>
  <rect width="960" height="300" fill="#ffffff"/>

  <g fill="#f6f6f2" stroke="#333" stroke-width="2">
    <rect x="20"  y="110" width="120" height="70" rx="4"/>
    <rect x="190" y="110" width="140" height="70" rx="4"/>
    <rect x="380" y="110" width="140" height="70" rx="4"/>
    <rect x="570" y="110" width="150" height="70" rx="4"/>
    <rect x="320" y="220" width="160" height="50" rx="4"/>
    <rect x="320" y="20"  width="160" height="50" rx="4"/>
  </g>
  <rect x="780" y="110" width="160" height="70" rx="4" fill="#e6f0f6" stroke="#2a6f97" stroke-width="2"/>

  <g fill="#333" text-anchor="middle">
    <text x="80" y="140" font-weight="bold">hello.c</text><text x="80" y="160" font-size="13">my C</text>
    <text x="260" y="136" font-weight="bold">gcc</text><text x="260" y="156" font-size="13">rv32e, ilp32e</text>
    <text x="450" y="136" font-weight="bold">link + objcopy</text><text x="450" y="156" font-size="13">at address 0</text>
    <text x="645" y="136" font-weight="bold">check and image</text><text x="645" y="156" font-size="13">every word legal?</text>
    <text x="860" y="136" fill="#1d5470" font-weight="bold">The core</text><text x="860" y="156" font-size="13" fill="#1d5470">in simulation</text>
    <text x="400" y="42" font-weight="bold">linker.ld, crt0.S</text><text x="400" y="60" font-size="12">memory layout, start-up</text>
    <text x="400" y="242" font-weight="bold">libgcc</text><text x="400" y="260" font-size="12">mul, div and mod helpers</text>
  </g>
  <g stroke="#333" stroke-width="2" fill="none">
    <path d="M140 145 H190"/><path d="M330 145 H380"/><path d="M520 145 H570"/><path d="M720 145 H780"/>
    <path d="M400 70 V110"/><path d="M400 220 V180"/>
  </g>
  <g fill="#333">
    <path d="M181 140 L190 145 L181 150 Z"/><path d="M371 140 L380 145 L371 150 Z"/>
    <path d="M561 140 L570 145 L561 150 Z"/><path d="M771 140 L780 145 L771 150 Z"/>
    <path d="M395 101 L400 110 L405 101 Z"/><path d="M395 189 L400 180 L405 189 Z"/>
  </g>
</svg>

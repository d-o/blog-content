  <title id="t">mtime ticks over 50 clocks, intended and as built</title>
  <desc id="d">Two rows of tick marks over 50 clock periods. The intended timer ticks twice, once every 25 clocks. As built, the prescaler compared against the wrong width and wrapped, so mtime ticked on every one of the 50 clocks.</desc>
  <rect width="960" height="300" fill="#ffffff"/>
  <text x="312" y="86" text-anchor="end" font-weight="bold" fill="#333">Intended</text>
  <text x="312" y="104" text-anchor="end" font-size="12" fill="#333">a tick every 25 clocks (TICK_DIV 25)</text>
  <path d="M330 100 H930" stroke="#333" stroke-width="2"/>
  <text x="312" y="186" text-anchor="end" font-weight="bold" fill="#333">As built</text>
  <text x="312" y="204" text-anchor="end" font-size="12" fill="#333">the compare wrapped: a tick every clock</text>

{{- $src := .Get "src" -}}
{{- $width := .Get "width" | default "480" -}}
{{- with .Page.Resources.GetMatch $src -}}
<figure style="margin:40px 0">
<video controls loop muted playsinline preload="metadata" style="display:block;margin:0 auto;max-width:100%;width:{{ $width }}px" src="{{ .RelPermalink }}"></video>
{{- with $.Get "caption" }}
<figcaption style="text-align:center">{{ . }}</figcaption>
{{- end }}
</figure>
{{- else -}}
{{- errorf "video shortcode: %q is not a resource of %s" $src $.Page.File.Path -}}
{{- end -}}

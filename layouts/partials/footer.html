            </div>
        </div>

        <footer class="footer">
            <div class="container">
                <div class="site-title-wrapper">
                    <div class="site-title">
                        <a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a>
                    </div>
                    <a class="button-square button-jump-top js-jump-top" href="#" aria-label="Back to Top">
                        <i class="fa fa-angle-up" aria-hidden="true"></i>
                    </a>
                </div>

                <p class="footer-copyright">
                    {{ if and .GitInfo .Site.Params.github_repo .Site.Params.github }}
                        <span><a href="{{ .Site.Params.github }}/{{ .Site.Params.github_repo }}/blob/{{ .GitInfo.Hash }}/content/{{ .File.Path }}">  {{ .GitInfo.AbbreviatedHash }}</a></span>
                    {{ end }}
                    <span>&copy; {{ .Site.Lastmod.Format "2006" }} / Powered by <a href="https://gohugo.io/">Hugo</a></span>
                </p>
                <p class="footer-copyright">
                    <span><a href="https://github.com/roryg/ghostwriter">Ghostwriter theme</a> By <a href="https://jollygoodthemes.com">JollyGoodThemes</a></span>
                    <span>/ <a href="https://github.com/d-o/ghostwriter">Based</a> on a port to Hugo By <a href="https://github.com/jbub">jbub</a></span>
                </p>
            </div>
        </footer>

        <script src="{{ .Site.BaseURL }}js/jquery-1.11.3.min.js"></script>
        <script src="{{ .Site.BaseURL }}js/jquery.fitvids.js"></script>
        <script src="{{ .Site.BaseURL }}js/scripts.js"></script>
        {{ partial "extra-in-foot.html" . }}
    </body>
</html>
